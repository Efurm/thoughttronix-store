{% extends "base.html" %}

{% block title %}Password changed — The ThoughtTronix Store{% endblock %}

{% block content %}
  <div class="mx-auto max-w-sm">
    <div class="card bg-base-100 shadow-md">
      <div class="card-body text-center">
        <p class="text-5xl">🔐</p>
        <h1 class="mt-2 text-2xl font-bold">Password changed</h1>
        <p class="mt-2 text-sm opacity-70">
          You're still signed in here. Every other device has been signed out,
          and we've sent a notice to your primary email.
        </p>
        <div class="card-actions mt-4 justify-center">
          <a href="{% url 'accounts:security' %}" class="btn btn-primary">Back to Account Security</a>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
