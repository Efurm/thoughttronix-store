{% extends "base.html" %}

{% block title %}Password reset — The ThoughtTronix Store{% endblock %}

{% block content %}
  <div class="mx-auto max-w-sm">
    <div class="card bg-base-100 shadow-md">
      <div class="card-body text-center">
        <p class="text-5xl">🔐</p>
        <h1 class="mt-2 text-2xl font-bold">Password reset</h1>
        <p class="mt-2 text-sm opacity-70">
          Your new password is set, and we've sent a notice to your primary
          email. Sign in to pick up where you left off.
        </p>
        <div class="card-actions mt-4 justify-center">
          <a href="{% url 'accounts:login' %}" class="btn btn-primary">Sign in</a>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
